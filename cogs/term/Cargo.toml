[package]
name = "steel-term"
edition = "2021"

[lib]
name = "steel_term"
crate-type = ["cdylib"]

[dependencies]
portable-pty = "0.8.1"
steel-core = { version = "0.8.3", features = ["anyhow", "dylibs", "sync"] }
abi_stable = "0.11.1"
futures = "0.3.26"
tokio = { version = "1.29.1", features = ["sync"] }
log = "0.4.17"
anyhow = "*"
wezterm-term = { git = "https://github.com/mattwparas/wezterm.git", branch = "mwp-public-scroll" }
config = { git = "https://github.com/mattwparas/wezterm.git", branch = "mwp-public-scroll" }
wezterm-surface = { git = "https://github.com/mattwparas/wezterm.git", branch = "mwp-public-scroll" }
parking_lot = "*"
futures-time = "3.0.0"
